name: Support SLA escalation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  escalate:
    runs-on: ubuntu-latest
    steps:
      - name: Process overdue support tickets
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the APP_URL repository variable and CRON_SECRET repository secret to enable SLA escalation."
            exit 0
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            --request POST "${APP_URL%/}/api/cron/support-sla" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json"
