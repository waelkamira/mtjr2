name: Advertising monthly invoices

on:
  schedule:
    - cron: "15 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advertising-monthly-invoices
  cancel-in-progress: false

jobs:
  invoice:
    runs-on: ubuntu-latest
    steps:
      - name: Generate previous-month advertising invoices
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/advertising-invoices"
