name: Identity PostgreSQL Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/server/identity/**"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "prisma/seed.cjs"
      - "tests/integration/**"
      - "vitest.integration.config.ts"
      - "package.json"
      - ".github/workflows/identity-integration.yml"

concurrency:
  group: identity-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mtjr2_identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mtjr2_identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mtjr2_identity_test?schema=public
      AUTH_SECRET: ci-only-secret-that-is-long-enough-for-validation
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Deploy committed migrations
        run: npx prisma migrate deploy
      - name: Seed baseline roles and permissions
        run: npm run db:seed
      - name: Run PostgreSQL-backed identity integration tests
        run: npm run test:integration
