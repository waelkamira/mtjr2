name: Platform PostgreSQL Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main, "feat/buying-cart-core", "feat/checkout-quote-reservations", "feat/checkout-address-capture", "feat/store-shipping-options", "feat/checkout-tax-calculation", "feat/verified-purchase-reviews", "feat/wishlist-favorites", "feat/product-qa", "feat/customer-support-tickets"]
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "src/server/cart/**"
      - "src/server/checkout/**"
      - "src/server/shipping/**"
      - "src/server/tax/**"
      - "src/server/orders/**"
      - "src/server/notifications/**"
      - "src/app/api/notifications/**"
      - "src/features/notifications/**"
      - "src/app/api/checkout/quote/**/place-order/**"
      - "src/app/api/orders/**"
      - "src/app/api/seller/orders/**"
      - "src/features/orders/**"
      - "src/app/api/admin/tax-rates/**"
      - "src/app/api/seller/shipping-rates/**"
      - "src/server/account/**"
      - "src/app/api/account/addresses/**"
      - "src/app/api/checkout/**"
      - "src/features/checkout/**"
      - "tests/checkout/**"
      - "src/app/api/cart/**"
      - "src/features/cart/**"
      - "src/features/storefront/**"
      - "src/server/catalog/product-qa.ts"
      - "src/server/support/**"
      - "src/app/api/support/**"
      - "src/app/api/admin/support/**"
      - "src/features/account/support-*.tsx"
      - "src/features/admin/support-page.tsx"
      - "src/app/api/products/**/questions/**"
      - "src/app/api/questions/**"
      - "src/app/api/account/questions/**"
      - "src/app/api/seller/questions/**"
      - "src/app/api/admin/questions/**"
      - "src/features/account/questions-page.tsx"
      - "src/features/seller/questions-page.tsx"
      - "src/features/admin/product-qa-page.tsx"
      - "tests/cart/**"
      - "tests/integration/**"
      - "vitest.integration.config.ts"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "src/server/identity/**"
      - "src/app/api/auth/**"
      - "src/app/api/admin/users/**/roles/**"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "prisma/seed.cjs"
      - "tests/integration/**"
      - "vitest.integration.config.ts"
      - "package.json"
      - "src/server/catalog/**"
      - "src/server/marketplace/**"
      - "src/server/inventory/**"
      - "src/server/cart/**"
      - "src/app/api/cart/**"
      - "src/features/cart/**"
      - "tests/cart/**"
      - "src/app/api/products/**"
      - "src/app/api/brands/**"
      - "src/app/api/categories/**"
      - "src/app/api/markets/**"
      - "src/features/storefront/**"
      - ".github/workflows/identity-integration.yml"

concurrency:
  group: platform-postgres-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mtjr2_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mtjr2_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mtjr2_platform_test?schema=public
      AUTH_SECRET: ci-only-secret-that-is-long-enough-for-validation
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Deploy committed migrations
        run: npx prisma migrate deploy
      - name: Seed baseline roles and permissions
        run: npm run db:seed
      - name: Run the existing PostgreSQL integration suite
        run: npm run test:integration
